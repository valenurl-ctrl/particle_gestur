name: Publish Cryptobross to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Crypto Knowledge/**"
      - ".github/workflows/publish-crypto-knowledge.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "Crypto Knowledge"
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
